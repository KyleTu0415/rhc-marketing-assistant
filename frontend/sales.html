<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHC 安瑞康 — 销售智能助手</title>
<style>
:root{
  --color-bg:#F7F8FA; --color-surface:#FFFFFF;
  --color-primary:#C8102E; --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB; --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB; --color-border-light:#F3F4F6;
  --color-success:#16A37B; --color-warning:#F3A94B; --color-danger:#E5484D; --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg);overflow:hidden}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:var(--font-sans);font-size:13px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--color-text);background:var(--color-surface);outline:none;transition:border-color var(--transition-fast)}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(200,16,46,0.12)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-text-tertiary)}

.app-layout{display:flex;height:100vh;width:100vw}
.sidebar{width:200px;min-width:200px;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow-y:auto;z-index:100}
.sidebar-logo{padding:15px 0 20px;text-align:center}
.sidebar-logo img{height:90px;width:auto;margin:0 auto;display:block}
.sidebar-logo span{display:block;font-size:13px;font-weight:700;color:var(--color-primary);margin-top:10px;letter-spacing:2px;text-transform:uppercase}
.sidebar-nav{flex:1}
.sidebar-nav .nav-section{padding:4px 16px 10px;font-size:15px;letter-spacing:0.5px;color:var(--color-text-secondary);font-weight:700}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;color:#6B7280;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);border-left:3px solid transparent;text-decoration:none;position:relative}
.sidebar-nav a.nav-item:hover{text-decoration:none}
.sidebar-nav .nav-item:hover{background:var(--color-primary-xlight);color:var(--color-primary)}
.sidebar-nav .nav-item.active{background:var(--color-primary-xlight);color:var(--color-primary);font-weight:600;border-left-color:var(--color-primary)}
.sidebar-nav .nav-item .nav-icon{width:14px;height:14px;flex-shrink:0;color:var(--color-text-tertiary);opacity:0.7}
.sidebar-nav .nav-item:hover .nav-icon,.sidebar-nav .nav-item.active .nav-icon{color:var(--color-primary)}
.sidebar-nav .nav-item-back-home{border-top:1px solid var(--color-border-light);margin-top:6px}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--color-border-light)}
.sidebar-user{display:flex;align-items:center;gap:8px}
.sidebar-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.sidebar-user .user-name{font-size:13px;font-weight:600}
.sidebar-user .user-role{font-size:11px;color:var(--color-text-tertiary)}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:56px;min-height:56px;background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 28px;gap:16px}
.topbar-title{font-size:16px;font-weight:600;flex:1}
.content-area{flex:1;overflow-y:auto;padding:20px 28px 28px}

.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-header h3{font-size:14px;font-weight:600}
.card-header .card-sub{font-size:12px;color:var(--color-text-tertiary);font-weight:400}
.card-body{padding:20px}

.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.2px;white-space:nowrap}
.tag-success{background:#E6F9F1;color:#0D7B57}
.tag-warning{background:#FFF4E0;color:#B27A1B}
.tag-gray{background:#F0F2F3;color:#637089}
.tag-primary{background:var(--color-primary-light);color:var(--color-primary-dark)}
.tag-info{background:#E8F0FE;color:#1A56C4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all var(--transition-fast)}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-dark)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-outline{border:1px solid var(--color-border);color:var(--color-text-secondary);background:var(--color-surface)}
.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-sm{padding:6px 12px;font-size:12px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--color-text-secondary);letter-spacing:0.5px;margin-bottom:6px}
.form-group select,.form-group input,.form-group textarea{width:100%}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--color-text);color:#fff;padding:12px 24px;border-radius:var(--radius-md);font-size:13px;font-weight:500;z-index:2000;opacity:0;transition:all .3s ease;box-shadow:var(--shadow-lg);pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--color-success)}
.toast-error{background:var(--color-danger)}

/* ===== Chat ===== */
.chat-messages{background:var(--color-bg);border:1px solid var(--color-border-light);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:14px;height:380px;overflow-y:auto}
.msg{display:flex;gap:10px;max-width:82%}
.msg .msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.msg-bot .msg-avatar{background:var(--color-primary)}
.msg-bot .msg-bubble{background:var(--color-surface);border:1px solid var(--color-border);border-radius:4px var(--radius-md) var(--radius-md) var(--radius-md);padding:10px 14px;font-size:13px;line-height:1.65;white-space:pre-wrap}
.msg-user{align-self:flex-end;flex-direction:row-reverse}
.msg-user .msg-avatar{background:var(--color-text-secondary)}
.msg-user .msg-bubble{background:var(--color-primary);color:#fff;border-radius:var(--radius-md) 4px var(--radius-md) var(--radius-md);padding:10px 14px;font-size:13px;line-height:1.65;white-space:pre-wrap}
.msg-bubble .msg-source{display:block;margin-top:8px;font-size:11px;color:var(--color-text-tertiary)}
.msg-user .msg-bubble .msg-source{color:rgba(255,255,255,.75)}
.chat-quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.quick-chip{padding:6px 14px;border:1px solid var(--color-border);border-radius:20px;font-size:12px;color:var(--color-text-secondary);background:var(--color-surface);cursor:pointer;transition:all var(--transition-fast)}
.quick-chip:hover{border-color:var(--color-primary);color:var(--color-primary)}
.chat-input-bar{display:flex;gap:10px;margin-top:12px}
.chat-input-bar input{flex:1;padding:10px 14px}
.typing-dots{display:inline-flex;gap:4px;align-items:center}
.typing-dots i{width:6px;height:6px;border-radius:50%;background:var(--color-text-tertiary);animation:blink 1.2s infinite}
.typing-dots i:nth-child(2){animation-delay:.2s}
.typing-dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* ===== Quote workbench ===== */
.quote-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.product-pick{border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
.product-pick-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--color-border-light);transition:background var(--transition-fast)}
.product-pick-row:last-child{border-bottom:none}
.product-pick-row:hover{background:var(--color-primary-xlight)}
.product-pick-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--color-primary);flex-shrink:0}
.product-pick-row .pp-name{flex:1;font-size:13px;font-weight:600}
.product-pick-row .pp-desc{font-size:11px;color:var(--color-text-tertiary);font-weight:400;margin-top:2px}
.product-pick-row input[type=number]{width:72px;padding:6px 8px;text-align:center}

/* ===== PI preview ===== */
.pi-doc{border:1px solid var(--color-border);border-radius:var(--radius-md);background:#fff;padding:28px;box-shadow:var(--shadow-sm)}
.pi-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--color-primary);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.pi-brand{font-size:16px;font-weight:800;color:var(--color-primary);letter-spacing:1px}
.pi-brand small{display:block;font-size:11px;color:var(--color-text-tertiary);font-weight:400;letter-spacing:0;margin-top:4px}
.pi-title{font-size:18px;font-weight:700;text-align:right}
.pi-title small{display:block;font-size:11px;color:var(--color-text-tertiary);font-weight:400;margin-top:4px}
.pi-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12px;margin-bottom:16px}
.pi-meta div span{color:var(--color-text-tertiary);margin-right:6px}
.pi-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
.pi-table th{background:var(--color-bg);padding:9px 10px;text-align:left;font-size:11px;color:var(--color-text-secondary);border:1px solid var(--color-border-light);letter-spacing:0.4px}
.pi-table td{padding:9px 10px;border:1px solid var(--color-border-light);vertical-align:top}
.pi-table .pi-qty{text-align:center;width:52px}
.pi-table .pi-price{text-align:right;width:110px;color:var(--color-text-tertiary)}
.pi-total-row{display:flex;justify-content:flex-end;gap:20px;font-size:13px;padding:10px 4px;border-top:2px solid var(--color-border)}
.pi-total-row strong{font-size:15px}
.pi-terms{font-size:11px;color:var(--color-text-secondary);background:var(--color-bg);border-radius:var(--radius-sm);padding:12px 14px;line-height:1.7}
.pi-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:280px;gap:10px;color:var(--color-text-tertiary)}
.pi-note{font-size:11px;color:var(--color-warning);margin-top:10px}

@media(max-width:860px){
  .sidebar{width:56px;min-width:56px}
  .sidebar .sidebar-logo span,.sidebar .nav-item span,.sidebar .nav-section,.sidebar .sidebar-user .user-info{display:none}
  .sidebar-logo{padding:16px 8px}
  .sidebar-nav .nav-item{padding:12px 0;justify-content:center;border-left:none;border-bottom:2px solid transparent}
  .sidebar-nav .nav-item.active{border-bottom-color:var(--color-primary)}
  .content-area{padding:16px}
  .quote-grid{grid-template-columns:1fr}
  .msg{max-width:95%}
}
</style>
</head>

   answer:'VW-8 输液泵提供高精度输注控制，支持多机联动，便于在病区或手术中统一管理多台设备的输液任务，适用于兽医医院的住院与术中补液场景。'}
];

var snapshotData=null;
var toastTimer=null;
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' toast-'+type:'');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='toast'+(type?' toast-'+type:'')},3200)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ===== 聊天 ===== */
function addMsg(role,html,sourceTag){
  var box=document.getElementById('chat-messages');
  var row=document.createElement('div');
  row.className='msg '+(role==='user'?'msg-user':'msg-bot');
  row.innerHTML='<div class="msg-avatar">'+(role==='user'?'我':'AI')+'</div><div class="msg-bubble">'+html+(sourceTag?'<span class="msg-source">'+esc(sourceTag)+'</span>':'')+'</div>';
  box.appendChild(row);box.scrollTop=box.scrollHeight;
}
function localAnswer(q){
  var ql=q.toLowerCase();
  var hits=PRODUCTS.filter(function(p){return p.keywords.some(function(k){return ql.indexOf(k.toLowerCase())>=0})});
  if(hits.length===0){
    return {text:'您好，我目前掌握的产品信息覆盖以下四款产品：\n· VAM-200 兽医麻醉机（小动物/猫狗）\n· VAM-300 大型动物麻醉机（马/牛等大动物）\n· VM-12 多参数监护仪（六参数）\n· VW-8 输液泵（高精度、多机联动）\n请直接输入产品型号或应用场景（如「猫」「马」「监护参数」），我会给出对应说明。更复杂的商务与报价问题请联系销售同事。',source:'本地产品清单兜底（未匹配到具体型号）'};
  }
  return {text:hits.map(function(p){return '【'+p.name+'】\n'+p.answer+'\n标准配置/特点：'+p.specs}).join('\n\n'),source:'本地产品清单'};
}
function askQuestion(q){
  addMsg('user',esc(q));
  var box=document.getElementById('chat-messages');
  var typing=document.createElement('div');typing.className='msg msg-bot';typing.id='typing-row';
  typing.innerHTML='<div class="msg-avatar">AI</div><div class="msg-bubble"><span class="typing-dots"><i></i><i></i><i></i></span></div>';
  box.appendChild(typing);box.scrollTop=box.scrollHeight;

  function done(text,source){
    var tr=document.getElementById('typing-row');if(tr)tr.remove();
    addMsg('bot',esc(text),source);
  }
  // 1) 优先 POST /api/chat
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})})
    .then(function(r){if(!r.ok)throw new Error('chat '+r.status);return r.json()})
    .then(function(d){
      var text=d.reply||d.message||d.response||d.answer||d.text||(d.data&&(d.data.reply||d.data.message))||'';
      if(!text)throw new Error('empty chat reply');
      done(String(text),'后端智能问答接口 /api/chat');
    })
    .catch(function(){
      // 2) 兜底 POST /api/copy
      fetch('/api/copy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_model:'',target_language:'en',platform:'',extra_keywords:q})})
        .then(function(r){if(!r.ok)throw new Error('copy '+r.status);return r.json()})
        .then(function(d){
          var text=d.copy||d.content||d.text||d.message||(d.data&&(d.data.copy||d.data.content))||'';
          if(!text)throw new Error('empty copy reply');
          done(String(text),'后端文案接口 /api/copy');
        })
        .catch(function(){
          // 3) 本地兜底
          setTimeout(function(){var a=localAnswer(q);done(a.text,a.source)},300);
        });
    });
}
function sendQuestion(){
  var inp=document.getElementById('chat-input');
  var q=inp.value.trim();if(!q)return;
  inp.value='';askQuestion(q);
}
function askQuick(q){document.getElementById('chat-input').value=q;sendQuestion()}

/* ===== 报价工作台 ===== */
function renderProductPick(){
  document.getElementById('product-pick').innerHTML=PRODUCTS.map(function(p,i){
    return '<label class="product-pick-row"><input type="checkbox" id="pp-'+i+'" data-model="'+esc(p.model)+'"><span class="pp-name">'+esc(p.name)+'<span class="pp-desc">'+esc(p.desc)+'</span></span><input type="number" min="1" max="999" value="1" id="pq-'+i+'"></label>';
  }).join('');
}
function generatePI(){
  var custSel=document.getElementById('quote-customer');
  var custName=custSel.value;
  if(!custName){showToast('请先选择客户','error');return}
  var lines=[];
  PRODUCTS.forEach(function(p,i){
    if(document.getElementById('pp-'+i).checked){
      var qty=parseInt(document.getElementById('pq-'+i).value,10)||1;
      if(qty>0)lines.push({product:p,qty:qty});
    }
  });
  if(lines.length===0){showToast('请至少勾选一个产品','error');return}
  var cust=(snapshotData.customers||[]).filter(function(c){return c['客户名称']===custName})[0]||{};
  var today=new Date();
  var dateStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var piNo='PI-FRAME-'+String(today.getFullYear()).slice(2)+String(today.getMonth()+1).padStart(2,'0')+'-'+String(Math.floor(Math.random()*900)+100);
  var rows=lines.map(function(l){
    return '<tr><td>'+esc(l.product.name)+'<div style="color:var(--color-text-tertiary);font-size:11px;margin-top:2px">'+esc(l.product.desc)+'</div></td><td class="pi-qty">'+l.qty+'</td><td class="pi-price">待销售填写</td><td class="pi-price">待销售填写</td></tr>';
  }).join('');
  document.getElementById('pi-area').innerHTML=
    '<div class="pi-doc">'+
      '<div class="pi-head"><div class="pi-brand">RHC 安瑞康<small>RHC Medical · Veterinary Equipment</small></div><div class="pi-title">形式发票 PROFORMA INVOICE<small>'+esc(piNo)+'</small></div></div>'+
      '<div class="pi-meta">'+
        '<div><span>客户：</span>'+esc(custName)+'</div>'+
        '<div><span>日期：</span>'+dateStr+'</div>'+
        '<div><span>国家/地区：</span>'+esc(cust['国家/地区']||'—')+'</div>'+
        '<div><span>联系人：</span>'+esc(cust['联系人']||'—')+'</div>'+
        '<div><span>主营产品：</span>'+esc(cust['主营产品']||'—')+'</div>'+
        '<div><span>负责销售：</span>—</div>'+
      '</div>'+
      '<table class="pi-table"><thead><tr><th>产品</th><th class="pi-qty">数量</th><th class="pi-price">单价</th><th class="pi-price">金额</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="pi-total-row"><span>合计：</span><strong>待销售填写（价格隔离：正式版价格仅销售可见）</strong></div>'+
      '<div class="pi-terms"><strong>条款（正式版自动带出）：</strong><br>付款方式：待销售填写　|　贸易术语（Incoterms）：待销售填写　|　交货期：待销售填写<br>质保：按 RHC 标准质保条款执行　|　报价有效期：待销售填写</div>'+
      '<div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-outline btn-sm" onclick="showToast(\'框架阶段：正式版支持在线编辑 PI 明细\')">编辑明细</button><button class="btn btn-primary btn-sm" onclick="showToast(\'框架阶段：正式版将生成PDF并推送Ella\',\'success\')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 导出 / 发送（正式版）</button></div>'+
      '<div class="pi-note">注：当前为框架预览，单价与合计在正式版中按销售权限自动填充，框架阶段不展示价格数据。</div>'+
    '</div>';
  showToast('PI 预览已生成','success');
}

/* ===== 初始化 ===== */
addMsg('bot','您好，我是 RHC 销售智能助手。您可以向我咨询 VAM-200、VAM-300、VM-12、VW-8 等产品的参数、适用场景与配置信息。点击下方常见问题，或直接输入问题开始。');
renderProductPick();
fetch('data/snapshot.json',{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(d){
    snapshotData=d;
    var sel=document.getElementById('quote-customer');
    sel.innerHTML='<option value="">— 选择客户 —</option>'+(d.customers||[]).map(function(c){
      return '<option value="'+esc(c['客户名称'])+'">'+esc(c['客户名称'])+'（'+esc(c['国家/地区']||'')+'）</option>';
    }).join('');
  })
  .catch(function(){
    document.getElementById('quote-customer').innerHTML='<option value="">客户数据加载失败</option>';
    showToast('客户数据加载失败，请通过本地 HTTP 服务访问本页面','error');
  });
</script>
