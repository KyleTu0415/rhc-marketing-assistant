<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — Real Healthcare 智能工作平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/IKKI2000/harmonyos-fonts@main/css/harmonyos_sans_sc.css">
<style>
:root{
  --color-bg:#F7F8FA;
  --color-surface:#FFFFFF;
  --color-primary:#C8102E;
  --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB;
  --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A;
  --color-text-secondary:#6B7280;
  --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB;
  --color-border-light:#F3F4F6;
  --font-sans:"HarmonyOS Sans SC","HarmonyOS Sans","Noto Sans SC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
  --transition-normal:0.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg)}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
input{font-family:var(--font-sans);font-size:14px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--color-text);background:var(--color-surface);outline:none;transition:border-color var(--transition-fast)}
input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(200,16,46,0.12)}

/* ===== Layout ===== */
.login-wrapper{display:flex;min-height:100vh}

/* Left brand panel */
.brand-panel{
  flex:0 0 52%;
  background:linear-gradient(135deg,var(--color-primary) 0%,var(--color-primary-dark) 100%);
  color:#fff;
  padding:60px 64px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.brand-panel::before{
  content:'';position:absolute;top:-200px;right:-200px;width:500px;height:500px;
  background:rgba(255,255,255,0.06);border-radius:50%;
}
.brand-panel::after{
  content:'';position:absolute;bottom:-150px;left:-100px;width:400px;height:400px;
  background:rgba(255,255,255,0.04);border-radius:50%;
}
.brand-logo{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.brand-logo .logo-mark{
  width:64px;height:64px;border-radius:16px;background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
.brand-logo .logo-text{
  font-size:20px;font-weight:700;letter-spacing:1px;
}
.brand-logo .logo-sub{
  font-size:12px;opacity:0.8;font-weight:400;margin-top:2px;letter-spacing:3px;
}
.brand-content{position:relative;z-index:1;max-width:440px}
.brand-content h1{font-size:40px;font-weight:700;line-height:1.25;margin-bottom:16px;letter-spacing:0.5px}
.brand-content h1 .highlight{color:#FFD1D9}
.brand-content .slogan{font-size:17px;line-height:1.8;opacity:0.92;margin-bottom:40px}
.assistant-slogan{
  font-size:24px;font-weight:500;letter-spacing:0.5px;
  color:rgba(255,255,255,0.78);
  margin-bottom:28px;padding-top:20px;
  position:relative;
}
.assistant-slogan::before{
  content:'';position:absolute;top:0;left:0;
  width:40px;height:2px;
  background:rgba(255,255,255,0.4);border-radius:1px;
}
.brand-features{display:flex;flex-direction:column;gap:18px}
.brand-feature{display:flex;align-items:flex-start;gap:14px}
.brand-feature-icon{
  width:36px;height:36px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.16);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-feature-text h3{font-size:14px;font-weight:600;margin-bottom:2px}
.brand-feature-text p{font-size:12px;opacity:0.75;line-height:1.6}
.brand-footer{position:relative;z-index:1;font-size:12px;opacity:0.6}

/* Right form panel */
.form-panel{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:40px;background:var(--color-bg);
}
.login-card{
  width:100%;max-width:400px;
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  padding:40px 36px;
  box-shadow:var(--shadow-sm);
}
.login-card .card-title{font-size:24px;font-weight:700;color:var(--color-text);margin-bottom:6px}
.login-card .card-subtitle{font-size:13px;color:var(--color-text-secondary);margin-bottom:32px}

.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:8px}
.input-with-icon{position:relative}
.input-with-icon input{width:100%;padding-left:42px}
.input-with-icon .input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--color-text-tertiary);
}
.input-with-icon input:focus + .input-icon{color:var(--color-primary)}

.form-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;font-size:13px}
.checkbox-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--color-text-secondary);user-select:none}
.checkbox-wrap input{width:16px;height:16px;cursor:pointer;accent-color:var(--color-primary)}
.forgot-link{color:var(--color-primary);font-size:13px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;
  font-weight:600;transition:all var(--transition-fast);width:100%;
}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-dark);box-shadow:0 4px 12px rgba(200,16,46,0.25)}
.btn-primary:active{transform:translateY(1px)}

.demo-tip{
  margin-top:20px;padding:12px 14px;background:var(--color-primary-xlight);
  border:1px solid var(--color-primary-light);border-radius:var(--radius-sm);
  font-size:12px;color:var(--color-primary-dark);text-align:center;
}
.demo-tip svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--color-text);color:#fff;padding:12px 24px;border-radius:var(--radius-md);
  font-size:13px;font-weight:500;z-index:2000;opacity:0;
  transition:all .3s ease;box-shadow:var(--shadow-lg);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:#16A37B}
.toast-error{background:#E5484D}

/* Responsive */
@media(max-width:960px){
  .login-wrapper{flex-direction:column}
  .brand-panel{flex:none;padding:40px 32px;min-height:auto}
  .brand-content{max-width:100%}
  .brand-content h1{font-size:28px}
  .brand-content .slogan{font-size:15px;margin-bottom:24px}
  .brand-content .assistant-slogan{font-size:18px;padding-top:16px;margin-bottom:20px}
  .brand-features{flex-direction:row;flex-wrap:wrap;gap:12px}
  .brand-feature{flex:1 1 45%}
  .brand-footer{display:none}
  .form-panel{padding:32px 20px}
  .login-card{padding:32px 24px}
}
@media(max-width:480px){
  .brand-features{flex-direction:column}
  .brand-feature{flex:none}
}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
var toastTimer = null;
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' toast-' + type : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    t.className = 'toast' + (type ? ' toast-' + type : '');
  }, 3000);
}

function handleLogin(e) {
  e.preventDefault();
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value.trim();
  var btn = document.getElementById('loginBtn');

  if (!username || !password) {
    showToast('请输入用户名和密码', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = '登录中...';
  showToast('登录成功，正在跳转...', 'success');

    localStorage.setItem('rhc_logged_in', '1');
  setTimeout(function() {
    window.location.href = 'panel.html';
  }, 600);
}

// Enter key support
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('username').focus();
});
</script>
