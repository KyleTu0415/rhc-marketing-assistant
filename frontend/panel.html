<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 — Real Healthcare 智能工作平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/IKKI2000/harmonyos-fonts@main/css/harmonyos_sans_sc.css">
<style>
:root{
  --color-bg:#F7F8FA;
  --color-surface:#FFFFFF;
  --color-primary:#C8102E;
  --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB;
  --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A;
  --color-text-secondary:#6B7280;
  --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB;
  --color-border-light:#F3F4F6;
  --color-success:#16A37B;
  --color-warning:#F3A94B;
  --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","HarmonyOS Sans","Noto Sans SC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
  --transition-normal:0.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg)}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}

/* ===== Top Nav ===== */
.topnav{
  height:60px;background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  display:flex;align-items:center;padding:0 32px;
  position:sticky;top:0;z-index:100;
}
.topnav-brand{display:flex;align-items:center;gap:12px;flex:1}
.topnav-brand .logo-mark{
  width:36px;height:36px;border-radius:50%;
  background:var(--color-primary);
  display:flex;align-items:center;justify-content:center;
}
.topnav-brand .brand-name{font-size:15px;font-weight:700;color:var(--color-text)}
.topnav-brand .brand-sub{font-size:12px;color:var(--color-text-secondary);margin-top:1px}

.topnav-user{display:flex;align-items:center;gap:12px}
.user-avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--color-primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
.user-info{text-align:right}
.user-name{font-size:13px;font-weight:600;color:var(--color-text)}
.user-role{font-size:11px;color:var(--color-text-tertiary);margin-top:1px}
.logout-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;border:1px solid var(--color-border);
  border-radius:var(--radius-sm);font-size:12px;font-weight:500;
  color:var(--color-text-secondary);background:var(--color-surface);
  transition:all var(--transition-fast);
}
.logout-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.logout-btn svg{width:14px;height:14px}

/* ===== Main Content ===== */
.main-container{max-width:1100px;margin:0 auto;padding:48px 32px 40px}
.welcome-section{margin-bottom:40px}
.welcome-greeting{font-size:28px;font-weight:700;color:var(--color-text);margin-bottom:8px}
.welcome-greeting .wave{display:inline-block;animation:wave 2s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(14deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}60%{transform:rotate(0)}}
.welcome-subtitle{font-size:15px;color:var(--color-text-secondary)}

.section-title{
  font-size:18px;font-weight:700;color:var(--color-text);
  margin-bottom:20px;display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';width:4px;height:18px;background:var(--color-primary);
  border-radius:2px;
}

/* ===== Assistant Cards Grid ===== */
.assistant-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  margin-bottom:48px;
}
.assistant-card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  padding:28px 24px;
  transition:all var(--transition-normal);
  cursor:pointer;
  position:relative;
  display:flex;flex-direction:column;
}
.assistant-card:hover:not(.disabled){
  box-shadow:var(--shadow-lg);
  transform:translateY(-4px);
  border-color:var(--color-primary);
}
.assistant-card.disabled{
  cursor:not-allowed;
  opacity:0.6;
}
.assistant-card.disabled:hover{
  box-shadow:var(--shadow-sm);
  transform:none;
  border-color:var(--color-border);
}

.assistant-icon{
  width:56px;height:56px;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
.assistant-icon svg{width:28px;height:28px}
.assistant-icon.icon-red{background:var(--color-primary-light);color:var(--color-primary)}
.assistant-icon.icon-blue{background:#E8F0FE;color:#3B82F6}
.assistant-icon.icon-gray{background:#F0F2F3;color:#6B7280}

.assistant-name{font-size:17px;font-weight:700;color:var(--color-text);margin-bottom:6px}
.assistant-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.7;margin-bottom:20px;flex:1}

.assistant-status{
  display:inline-flex;align-items:center;align-self:flex-start;
  padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:600;
}
.status-active{background:var(--color-primary-light);color:var(--color-primary)}
.status-coming{background:#F0F2F3;color:#6B7280}
.status-planning{background:#F0F2F3;color:#9CA3AF}

.assistant-card .card-arrow{
  position:absolute;top:24px;right:24px;
  width:20px;height:20px;color:var(--color-text-tertiary);
  transition:all var(--transition-fast);
}
.assistant-card:hover:not(.disabled) .card-arrow{
  color:var(--color-primary);
  transform:translateX(2px);
}

/* ===== Footer ===== */
.page-footer{
  text-align:center;padding:24px 0;
  font-size:12px;color:var(--color-text-tertiary);
  border-top:1px solid var(--color-border-light);
  margin-top:20px;
}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--color-text);color:#fff;padding:12px 24px;border-radius:var(--radius-md);
  font-size:13px;font-weight:500;z-index:2000;opacity:0;
  transition:all .3s ease;box-shadow:var(--shadow-lg);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--color-success)}
.toast-error{background:#E5484D}
.toast-warning{background:var(--color-warning)}

/* ===== Responsive ===== */
@media(max-width:960px){
  .assistant-grid{grid-template-columns:repeat(2,1fr)}
  .main-container{padding:32px 20px}
}
@media(max-width:600px){
  .topnav{padding:0 16px;height:56px}
  .main-container{padding:24px 16px}
  .welcome-greeting{font-size:22px}
  .assistant-grid{grid-template-columns:1fr}
  .topnav-brand .brand-sub{display:none}
  .user-info{display:none}
  .logout-btn span{display:none}
  .logout-btn{padding:7px 10px}
}

/* Focus */
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:2px}
</style>
</head>
<body>
<!-- Top Navigation -->
<nav class="topnav">
  <div class="topnav-brand">
    <div class="logo-mark">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <text x="1" y="16" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#fff">RH</text>
      </svg>
    </div>
    <div>
      <div class="brand-name">Real Healthcare</div>
      <div class="brand-sub">智能工作平台</div>
    </div>
  </div>
  <div class="topnav-user">
    <div class="user-info">
      <div class="user-name">Ella</div>
      <div class="user-role">市场部</div>
    </div>
    <div class="user-avatar">E</div>
    <button class="logout-btn" onclick="handleLogout()" title="退出登录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>退出登录</span>
    </button>
  </div>
</nav>

<!-- Main Content -->
<main class="main-container">
  <section class="welcome-section">
    <h1 class="welcome-greeting">
      你好，Ella <span class="wave">👋</span>
    </h1>
    <p class="welcome-subtitle">欢迎回到 Real Healthcare 智能工作平台，请选择您要进入的工作台</p>
  </section>

  <h2 class="section-title">选择工作台</h2>

  <div class="assistant-grid">
    <!-- 营销中心 -->
    <div class="assistant-card" onclick="enterMarketing()" role="button" tabindex="0" onkeydown="if(event.key==='Enter')enterMarketing()">
      <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
      <div class="assistant-icon icon-red">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <h3 class="assistant-name">营销中心</h3>
      <p class="assistant-desc">社媒营销、图片合成、素材管理</p>
      <span class="assistant-status status-active">立即进入</span>
    </div>

    <!-- 销售智能助手 -->
    <div class="assistant-card disabled" onclick="showToast('即将上线，敬请期待','warning')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')showToast('即将上线，敬请期待','warning')">
      <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
      <div class="assistant-icon icon-blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
      </div>
      <h3 class="assistant-name">销售智能助手</h3>
      <p class="assistant-desc">产品知识问答、竞品对比、场景推荐</p>
      <span class="assistant-status status-coming">即将上线</span>
    </div>

    <!-- 客户管理 CRM -->
    <div class="assistant-card disabled" onclick="showToast('规划中，敬请期待','warning')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')showToast('规划中，敬请期待','warning')">
      <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
      <div class="assistant-icon icon-gray">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87"/>
          <path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
      </div>
      <h3 class="assistant-name">客户管理 CRM</h3>
      <p class="assistant-desc">客户档案、商机跟进、成交转化</p>
      <span class="assistant-status status-planning">规划中</span>
    </div>
  </div>

  <footer class="page-footer">
    © 2026 Real Healthcare. All rights reserved.
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
var toastTimer = null;
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' toast-' + type : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    t.className = 'toast' + (type ? ' toast-' + type : '');
  }, 3000);
}

function enterMarketing() {
  window.location.href = 'index.html';
}

function handleLogout() {
  if (confirm('确定要退出登录吗？')) {
    window.location.href = 'login.html';
  }
}
</script>
</body>
</html>
