<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHC 安瑞康 — 经营仪表盘</title>
<style>
:root{
  --color-bg:#F7F8FA; --color-surface:#FFFFFF;
  --color-primary:#C8102E; --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB; --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB; --color-border-light:#F3F4F6;
  --color-success:#16A37B; --color-warning:#F3A94B; --color-danger:#E5484D; --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg);overflow:hidden}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:var(--font-sans);font-size:13px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--color-text);background:var(--color-surface);outline:none;transition:border-color var(--transition-fast)}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(200,16,46,0.12)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-text-tertiary)}

/* ===== Layout ===== */
.app-layout{display:flex;height:100vh;width:100vw}
.sidebar{width:200px;min-width:200px;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow-y:auto;z-index:100}
.sidebar-logo{padding:16px 0 14px;text-align:center}
.logo-badge{width:42px;height:42px;border-radius:10px;background:var(--color-primary);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 auto;letter-spacing:0.5px}
.sidebar-logo span{display:block;font-size:13px;font-weight:700;color:var(--color-primary);margin-top:8px;letter-spacing:3px}
.sidebar-nav{flex:1}
.sidebar-nav .nav-section{padding:12px 16px 8px;font-size:12px;letter-spacing:1px;color:var(--color-text-tertiary);font-weight:600}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--color-text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);border-left:3px solid transparent;text-decoration:none}
.sidebar-nav a.nav-item:hover{text-decoration:none}
.sidebar-nav .nav-item:hover{background:var(--color-primary-xlight);color:var(--color-primary)}
.sidebar-nav .nav-item.active{background:var(--color-primary-xlight);color:var(--color-primary);font-weight:600;border-left-color:var(--color-primary)}
.sidebar-nav .nav-item .nav-icon{width:16px;height:16px;flex-shrink:0;color:var(--color-text-tertiary)}
.sidebar-nav .nav-item:hover .nav-icon,.sidebar-nav .nav-item.active .nav-icon{color:var(--color-primary)}
.sidebar-nav .nav-item-back-home{border-top:1px solid var(--color-border-light);margin-top:6px}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--color-border-light)}
.sidebar-user{display:flex;align-items:center;gap:8px}
.sidebar-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.sidebar-user .user-name{font-size:13px;font-weight:600}
.sidebar-user .user-role{font-size:11px;color:var(--color-text-tertiary)}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:56px;min-height:56px;background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 28px;gap:16px}
.topbar-title{font-size:16px;font-weight:600;flex:1}
.topbar-actions{display:flex;align-items:center;gap:10px}
.content-area{flex:1;overflow-y:auto;padding:20px 28px 28px}

/* ===== Cards / metrics ===== */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.metric-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:20px;transition:box-shadow var(--transition-fast)}
.metric-card:hover{box-shadow:var(--shadow-md)}
.metric-card .metric-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.metric-card .metric-value{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.metric-card .metric-value .value-sub{font-size:14px;font-weight:600;color:var(--color-text-secondary);margin-left:6px}
.metric-card .metric-label{font-size:13px;color:var(--color-text-secondary);margin-top:4px}
.metric-card .metric-note{font-size:12px;color:var(--color-text-tertiary);margin-top:8px;line-height:1.5}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-header h3{font-size:14px;font-weight:600}
.card-header .card-sub{font-size:12px;color:var(--color-text-tertiary);font-weight:400}
.card-body{padding:20px}
.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* ===== Bar charts (pure CSS) ===== */
.bar-chart{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px}
.bar-label{width:118px;flex-shrink:0;color:var(--color-text-secondary);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--color-bg);border-radius:6px;height:20px;min-width:50px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:var(--color-primary);width:0;transition:width .5s ease}
.bar-fill.fill-green{background:var(--color-success)}
.bar-fill.fill-blue{background:var(--color-info)}
.bar-val{width:34px;flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums;color:var(--color-text)}
.chart-legend-note{font-size:12px;color:var(--color-text-tertiary);margin-top:14px}

/* ===== Tags / buttons ===== */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.2px;white-space:nowrap}
.tag-success{background:#E6F9F1;color:#0D7B57}
.tag-warning{background:#FFF4E0;color:#B27A1B}
.tag-gray{background:#F0F2F3;color:#637089}
.tag-primary{background:var(--color-primary-light);color:var(--color-primary-dark)}
.tag-info{background:#E8F0FE;color:#1A56C4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all var(--transition-fast)}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-dark)}
.btn-outline{border:1px solid var(--color-border);color:var(--color-text-secondary);background:var(--color-surface)}
.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-sm{padding:6px 12px;font-size:12px}

/* ===== Toast / state ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--color-text);color:#fff;padding:12px 24px;border-radius:var(--radius-md);font-size:13px;font-weight:500;z-index:2000;opacity:0;transition:all .3s ease;box-shadow:var(--shadow-lg);pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--color-success)}
.toast-error{background:var(--color-danger)}
.state-message{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 20px;gap:10px;color:var(--color-text-secondary);font-size:13px;grid-column:1/-1}
.data-source-note{margin-top:24px;font-size:12px;color:var(--color-text-tertiary);text-align:center}
.loading-row{display:flex;align-items:center;gap:10px;color:var(--color-text-secondary);font-size:13px;padding:40px 0;justify-content:center}
.loading-spinner{width:20px;height:20px;border:2.5px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:860px){
  .sidebar{width:56px;min-width:56px}
  .sidebar .sidebar-logo span,.sidebar .nav-item span,.sidebar .nav-section,.sidebar .sidebar-user .user-info{display:none}
  .sidebar-logo{padding:16px 8px}
  .sidebar-nav .nav-item{padding:12px 0;justify-content:center;border-left:none;border-bottom:2px solid transparent}
  .sidebar-nav .nav-item.active{border-bottom-color:var(--color-primary)}
  .topbar{padding:0 16px}
  .content-area{padding:16px}
  .metric-grid{grid-template-columns:1fr 1fr}
  .dashboard-grid{grid-template-columns:1fr}
  .bar-label{width:84px;font-size:11px}
}
@media(max-width:480px){.metric-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-layout">
<nav class="sidebar" aria-label="主导航">

    <a class="nav-item" href="sales.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>销售智能助手</span></a>

    <a class="nav-item" href="customers.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>客户管理</span></a>

    <a class="nav-item" href="aftersales.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/></svg><span>售后中心</span></a>

  </div>
  <div class="sidebar-footer">
    <div class="sidebar-user"><div class="avatar">E</div><div><div class="user-name">Ella</div><div class="user-role">市场部</div></div></div>
  </div>
</nav>
<div class="main-area">
  <header class="topbar">
    <div class="topbar-title">经营仪表盘</div>
    <div class="topbar-actions"><span class="tag tag-gray" id="snapshot-time">快照加载中</span></div>
  </header>
  <main class="content-area">
    <div class="metric-grid" id="metric-grid">
      <div class="metric-card"><div class="metric-icon" style="background:var(--color-primary-light)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="metric-value" id="m-customers">—</div><div class="metric-label">客户总数</div><div class="metric-note" id="m-customers-note">正在读取快照数据…</div></div>
      <div class="metric-card"><div class="metric-icon" style="background:#FFF4E0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B27A1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/></svg></div><div class="metric-value" id="m-ongoing">—</div><div class="metric-label">进行中订单数</div><div class="metric-note">未完成履约的订单</div></div>
      <div class="metric-card"><div class="metric-icon" style="background:#E6F9F1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D7B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="metric-value" id="m-done">—</div><div class="metric-label">本月已完成订单数</div><div class="metric-note">状态为「已完成」的订单</div></div>
      <div class="metric-card"><div class="metric-icon" style="background:#E8F0FE"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A56C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="metric-value" id="m-transit">—</div><div class="metric-label">在途货值（原币口径）</div><div class="metric-note" id="m-transit-note">进行中订单金额，按币种分列</div></div>
    </div>

    <div id="charts-area">
      <div class="loading-row"><span class="loading-spinner"></span> 正在加载经营数据…</div>
    </div>

    <p class="data-source-note">数据来源：飞书多维表格，框架阶段定时快照；正式版实时同步</p>
  </main>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var ORDER_STATUSES=['已成交','单据制作中','待配置校验','已发仓库待配货','可提货','已提货','报关中·已进仓','已发运','已完成'];
var toastTimer=null;
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' toast-'+type:'');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='toast'+(type?' toast-'+type:'')},3000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function parseMoney(s){var m=String(s||'').match(/^([^\d]*)([\d,\.]+)/);if(!m)return{cur:String(s||'').trim(),val:0};return{cur:m[1].trim(),val:parseFloat(m[2].replace(/,/g,''))||0}}
function fmtMoney(cur,val){return cur+val.toLocaleString('en-US',{maximumFractionDigits:0})}

function barChartHtml(rows,fillClass){
  var max=0;rows.forEach(function(r){if(r.count>max)max=r.count});
  return '<div class="bar-chart">'+rows.map(function(r){
    var pct=max>0?Math.round(r.count/max*100):0;
    return '<div class="bar-row" title="'+esc(r.label)+'：'+r.count+'">'+
      '<div class="bar-label">'+esc(r.label)+'</div>'+
      '<div class="bar-track"><div class="bar-fill '+(fillClass||'')+'" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-val">'+r.count+'</div></div>';
  }).join('')+'</div>';
}

function render(data){
  var customers=data.customers||[],orders=data.orders||[];
  // 指标
  document.getElementById('m-customers').textContent=customers.length;
  document.getElementById('m-customers-note').textContent='覆盖 '+[...new Set(customers.map(function(c){return c['国家/地区']}))].length+' 个国家/地区';
  var ongoing=orders.filter(function(o){return o['当前状态']!=='已完成'});
  var done=orders.filter(function(o){return o['当前状态']==='已完成'});
  document.getElementById('m-ongoing').textContent=ongoing.length;
  document.getElementById('m-done').textContent=done.length;
  // 在途货值：按币种分组求和（原币口径，不做汇率折算）
  var groups={};
  ongoing.forEach(function(o){var p=parseMoney(o['订单金额（原币）']);if(!groups[p.cur])groups[p.cur]=0;groups[p.cur]+=p.val});
  var curList=Object.keys(groups).sort(function(a,b){return groups[b]-groups[a]});
  var mt=document.getElementById('m-transit');
  if(curList.length){
    mt.textContent=fmtMoney(curList[0],groups[curList[0]]);
    if(curList.length>1){
      var sub=document.createElement('span');sub.className='value-sub';sub.textContent='等'+curList.length+'币种';
      mt.appendChild(sub);
    }
    var rest=curList.slice(1).map(function(c){return fmtMoney(c,groups[c])}).join(' · ');
    var note=document.getElementById('m-transit-note');
    note.textContent=(rest?rest+'；':'')+'共 '+ongoing.length+' 单，未做汇率折算';
    mt.title='在途货值（原币口径）：'+curList.map(function(c){return fmtMoney(c,groups[c])}).join('、');
  }else{mt.textContent='0';document.getElementById('m-transit-note').textContent='暂无进行中订单'}
  // 快照时间
  if(data.generated_at)document.getElementById('snapshot-time').textContent='快照时间 '+esc(data.generated_at);

  // 图表一：订单状态分布（9状态）
  var statusRows=ORDER_STATUSES.map(function(s){return{label:s,count:orders.filter(function(o){return o['当前状态']===s}).length}});
  // 图表二：客户国家/地区分布
  var cmap={};
  customers.forEach(function(c){var k=c['国家/地区']||'未填写';cmap[k]=(cmap[k]||0)+1});
  var countryRows=Object.keys(cmap).map(function(k){return{label:k,count:cmap[k]}}).sort(function(a,b){return b.count-a.count});

  document.getElementById('charts-area').innerHTML=
    '<div class="dashboard-grid">'+
      '<div class="card"><div class="card-header"><h3>订单状态分布</h3><span class="card-sub">共 '+orders.length+' 单 · 9 个履约节点</span></div><div class="card-body">'+
        barChartHtml(statusRows,'')+
        '<div class="chart-legend-note">红色为进行中节点，绿色为已完成节点</div>'+
      '</div></div>'+
      '<div class="card"><div class="card-header"><h3>客户国家 / 地区分布</h3><span class="card-sub">共 '+customers.length+' 家客户</span></div><div class="card-body">'+
        barChartHtml(countryRows,'fill-blue')+
        '<div class="chart-legend-note">按客户档案所属国家/地区统计</div>'+
      '</div></div>'+
    '</div>';
  // 已完成节点条改绿
  var fills=document.querySelectorAll('#charts-area .bar-row');
  fills.forEach(function(row){if(row.getAttribute('title')&&row.getAttribute('title').indexOf('已完成：')===0){var f=row.querySelector('.bar-fill');if(f)f.classList.add('fill-green')}});
}

function renderError(err){
  document.getElementById('snapshot-time').textContent='快照不可用';
  ['m-customers','m-ongoing','m-done','m-transit'].forEach(function(id){document.getElementById(id).textContent='—'});
  document.getElementById('m-customers-note').textContent='数据加载失败';
  document.getElementById('charts-area').innerHTML=
    '<div class="card"><div class="card-body"><div class="state-message">'+
    '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-warning)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'+
    '<div style="font-weight:600;color:var(--color-text)">数据加载失败</div>'+
    '<div>无法读取 data/snapshot.json。请通过本地 HTTP 服务访问本页面（例如在 frontend 目录运行 <code>python3 -m http.server</code> 后访问），不要直接双击打开 HTML 文件。</div>'+
    '<button class="btn btn-outline btn-sm" onclick="location.reload()">重新加载</button>'+
    '</div></div></div>';
}

fetch('data/snapshot.json',{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(render)
  .catch(renderError);
</script>
</body>
</html>
