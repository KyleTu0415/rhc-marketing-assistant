<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/rhc-fonts.css">

<title>RHC 安瑞康 — 新闻中心</title>
<style>
:root{
  --color-bg:#F7F8FA; --color-surface:#FFFFFF;
  --color-primary:#C8102E; --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB; --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB; --color-border-light:#F3F4F6;
  --color-success:#16A37B; --color-warning:#F3A94B; --color-danger:#E5484D; --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg)}
a{color:var(--color-primary);text-decoration:none}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}

/* ===== 顶部导航 ===== */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  display:flex;align-items:center;gap:16px;
  padding:0 32px;height:60px;
}
/* 品牌区：DOM 结构与样式与门户首页 panel.html 完全一致 */
.topnav-brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex:0 0 auto}
.topnav-brand .logo-mark{
  height:40px;width:auto;
  display:flex;align-items:center;justify-content:center;
}
.topnav-brand .brand-sub{font-size:15px;font-weight:600;color:var(--color-text);margin-top:1px;letter-spacing:0.5px}
.topbar-divider{width:1px;height:16px;background:var(--color-border);flex-shrink:0;margin-top:1px}
.topbar-title{font-size:14px;color:var(--color-text-secondary);margin-top:1px}
.topbar-back{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--color-primary);
  padding:7px 14px;border:1px solid var(--color-primary);border-radius:var(--radius-sm);
  transition:all var(--transition-fast);
}
.topbar-back:hover{background:var(--color-primary);color:#fff}

/* ===== 主体 ===== */
.page{max-width:860px;margin:0 auto;padding:28px 24px 60px}
.page-header{margin-bottom:20px}
.page-header h1{font-size:22px;font-weight:700;margin-bottom:6px}
.page-header p{font-size:13px;color:var(--color-text-secondary)}

/* Tabs */
.cat-tabs{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;
  position:sticky;top:60px;z-index:50;
  background:var(--color-bg);padding:12px 0;
}
.cat-tab{
  padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;
  background:var(--color-surface);color:var(--color-text-secondary);
  border:1px solid var(--color-border);
  transition:all var(--transition-fast);
}
.cat-tab:hover{border-color:var(--color-primary);color:var(--color-primary)}
.cat-tab.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.cat-tab[data-cat]::before{
  content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:7px;vertical-align:0;
}
.cat-tab[data-cat="industry"]::before{background:#1565C0}
.cat-tab[data-cat="market"]::before{background:#2E7D32}
.cat-tab[data-cat="competitor"]::before{background:#E65100}
.cat-tab[data-cat="product"]::before{background:#7C3AED}
.cat-tab.active::before{background:#fff !important}
.cat-tab[data-cat="all"]::before{display:none}
.cat-tab .tab-count{
  display:inline-block;margin-left:6px;font-size:11px;font-weight:700;
  opacity:0.75;
}

/* 新闻卡片 */
.news-card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  padding:18px 22px;margin-bottom:14px;
  transition:all var(--transition-fast);
}
.news-card:hover{border-color:var(--color-primary);box-shadow:var(--shadow-md)}
.news-card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.news-cat-tag{
  display:inline-flex;align-items:center;
  padding:2px 10px;border-radius:4px;
  font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap;
}
.news-cat-tag.industry{background:#E3F2FD;color:#1565C0}
.news-cat-tag.market{background:#E8F5E9;color:#2E7D32}
.news-cat-tag.competitor{background:#FFF3E0;color:#E65100}
.news-cat-tag.product{background:#F3E8FD;color:#7C3AED}
.news-date{font-size:12px;color:var(--color-text-tertiary);margin-left:auto;white-space:nowrap}
.news-bookmark-btn{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--color-text-tertiary);transition:all var(--transition-fast);
}
.news-bookmark-btn:hover{color:var(--color-primary);background:var(--color-primary-xlight)}
.news-bookmark-btn.saved{color:var(--color-primary)}
.news-bookmark-btn.saved svg{fill:var(--color-primary)}
.news-bookmark-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;transition:fill var(--transition-fast)}
.news-card-title{
  font-size:15px;font-weight:600;color:var(--color-text);line-height:1.5;
  display:block;margin-bottom:6px;transition:color var(--transition-fast);
}
a.news-card-title:hover,.news-card:hover .news-card-title{color:var(--color-primary)}
.news-card-summary{font-size:13px;color:var(--color-text-secondary);line-height:1.7;margin-bottom:10px}
.news-card-footer{display:flex;align-items:center;gap:14px}
.news-link{font-size:12px;font-weight:600;color:var(--color-primary);display:inline-flex;align-items:center;gap:4px}
.news-region-tag{font-size:11px;color:var(--color-text-tertiary);background:var(--color-border-light);padding:2px 8px;border-radius:4px}

/* 加载状态 */
.load-status{text-align:center;padding:20px 0;color:var(--color-text-tertiary);font-size:13px}
.load-status .spinner{
  display:inline-block;width:16px;height:16px;border:2px solid var(--color-border);
  border-top-color:var(--color-primary);border-radius:50%;
  animation:spin 0.7s linear infinite;vertical-align:-3px;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-tip{text-align:center;padding:60px 0;color:var(--color-text-tertiary);font-size:13px}

/* Toast */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1A1A1A;color:#fff;padding:10px 22px;border-radius:8px;
  font-size:13px;z-index:2000;opacity:0;pointer-events:none;
  transition:all 0.25s ease;box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.toast-success{background:var(--color-success)}
.toast.toast-warning{background:var(--color-warning)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topnav-brand" onclick="location.href='panel.html'">
    <div class="logo-mark">
      <img src="assets/rhc-logo-mark.png?v=20260903" alt="RHC" style="height:40px;width:auto;object-fit:contain;">
    </div>
    <div>
      <div class="brand-sub">智能工作平台</div>
    </div>
  </div>
  <div class="topbar-divider"></div>
  <span class="topbar-title">新闻中心</span>
  <button class="topbar-back" onclick="location.href='panel.html'">← 返回门户</button>
</div>

<div class="page">
  <div class="page-header">
    <h1>新闻中心</h1>
    <p>行业趋势、市场动态、同行新闻与产品技术，持续更新，销售可随时收藏为邮件素材</p>
  </div>

  <div class="cat-tabs" id="cat-tabs">
    <button class="cat-tab active" data-cat="all" onclick="switchCat('all')">全部<span class="tab-count" id="count-all"></span></button>
    <button class="cat-tab" data-cat="industry" onclick="switchCat('industry')">行业趋势<span class="tab-count" id="count-industry"></span></button>
    <button class="cat-tab" data-cat="market" onclick="switchCat('market')">市场动态<span class="tab-count" id="count-market"></span></button>
    <button class="cat-tab" data-cat="competitor" onclick="switchCat('competitor')">同行新闻<span class="tab-count" id="count-competitor"></span></button>
    <button class="cat-tab" data-cat="product" onclick="switchCat('product')">产品技术<span class="tab-count" id="count-product"></span></button>
  </div>

  <div id="news-feed"></div>
  <div class="load-status" id="load-status"></div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/rhc-insights.js"></script>
<script>
var PAGE_SIZE = 6;
var _cat = 'all';
var _loadedCount = 0;
var _allItems = [];
var _loading = false;
var toastTimer = null;

var REGION_LABELS = {
  'global':'全球','north-america':'北美','europe':'欧洲','africa':'非洲',
  'middle-east':'中东','southeast-asia':'东南亚','brazil':'巴西',
  'china':'中国','asia':'亚洲'
};

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' toast-' + type : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast' + (type ? ' toast-' + type : ''); }, 2600);
}

function getSavedIds() {
  try { var s = localStorage.getItem('rhc_saved_insights'); if (s) return JSON.parse(s); } catch(e) {}
  return [];
}
function setSavedIds(arr) { localStorage.setItem('rhc_saved_insights', JSON.stringify(arr)); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function getItems(cat) {
  var items = RHC_INSIGHT_DATA.slice();
  if (cat && cat !== 'all') items = items.filter(function(it){ return it.category === cat; });
  items.sort(function(a, b){ return b.date.localeCompare(a.date); });
  return items;
}

function renderCounts() {
  document.getElementById('count-all').textContent = RHC_INSIGHT_DATA.length;
  ['industry','market','competitor','product'].forEach(function(c){
    document.getElementById('count-' + c).textContent = RHC_INSIGHT_DATA.filter(function(it){ return it.category === c; }).length;
  });
}

function cardHtml(item) {
  var saved = getSavedIds();
  var isSaved = saved.indexOf(item.id) !== -1;
  var titleInner = item.url
    ? '<a class="news-card-title" href="' + item.url + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>'
    : '<div class="news-card-title">' + esc(item.title) + '</div>';
  var regions = (item.regions || []).map(function(r){
    return '<span class="news-region-tag">' + esc(REGION_LABELS[r] || r) + '</span>';
  }).join('');
  var link = item.url ? '<a class="news-link" href="' + item.url + '" target="_blank" rel="noopener">查看原文 ↗</a>' : '';
  return '<div class="news-card">'
    + '<div class="news-card-top">'
    +   '<span class="news-cat-tag ' + item.categoryColor + '">' + esc(item.categoryLabel) + '</span>'
    +   '<span class="news-date">' + esc(item.date) + '</span>'
    +   '<button class="news-bookmark-btn' + (isSaved ? ' saved' : '') + '" onclick="toggleSave(\'' + item.id + '\')" title="' + (isSaved ? '取消收藏' : '收藏到素材库') + '" aria-label="收藏">'
    +     '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
    +   '</button>'
    + '</div>'
    + titleInner
    + '<p class="news-card-summary">' + esc(item.summary) + '</p>'
    + '<div class="news-card-footer">' + link + regions + '</div>'
    + '</div>';
}

function renderBatch(reset) {
  if (_loading) return;
  _loading = true;
  var status = document.getElementById('load-status');
  var feed = document.getElementById('news-feed');

  if (reset) {
    feed.innerHTML = '';
    _loadedCount = 0;
  }

  status.innerHTML = '<span class="spinner"></span>加载中...';

  // 模拟异步加载（后期接 RSS/后端接口时，替换为真实分页请求）
  setTimeout(function(){
    var next = _allItems.slice(_loadedCount, _loadedCount + PAGE_SIZE);
    var html = '';
    for (var i = 0; i < next.length; i++) html += cardHtml(next[i]);
    feed.insertAdjacentHTML('beforeend', html);
    _loadedCount += next.length;

    if (_loadedCount >= _allItems.length) {
      status.textContent = _allItems.length === 0 ? '' : '— 已加载全部 ' + _allItems.length + ' 条 —';
    } else {
      status.textContent = '下滑加载更多（已加载 ' + _loadedCount + '/' + _allItems.length + '）';
    }
    _loading = false;
  }, 300);
}

function toggleSave(id) {
  var saved = getSavedIds();
  var idx = saved.indexOf(id);
  if (idx !== -1) { saved.splice(idx, 1); showToast('已取消收藏'); }
  else { saved.push(id); showToast('已收藏到个人素材库', 'success'); }
  setSavedIds(saved);
  // 刷新当前可见卡片的收藏按钮状态
  var btns = document.querySelectorAll('.news-bookmark-btn');
  // 简单做法：重渲染已加载部分
  var feed = document.getElementById('news-feed');
  var html = '';
  for (var i = 0; i < _loadedCount; i++) html += cardHtml(_allItems[i]);
  feed.innerHTML = html;
}

function switchCat(cat) {
  _cat = cat;
  var tabs = document.querySelectorAll('.cat-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-cat') === cat);
  }
  _allItems = getItems(cat);
  window.scrollTo({ top: document.getElementById('news-feed').offsetTop - 130, behavior: 'smooth' });
  renderBatch(true);
}

function onScroll() {
  if (_loadedCount >= _allItems.length || _loading) return;
  var status = document.getElementById('load-status');
  var rect = status.getBoundingClientRect();
  if (rect.top < window.innerHeight + 100) {
    renderBatch(false);
  }
}

document.addEventListener('DOMContentLoaded', function(){
  renderCounts();
  _allItems = getItems('all');
  renderBatch(true);
  window.addEventListener('scroll', onScroll);
});
</script>
<script src="assets/rhc-widget.js?v=20260831hv"></script>
</body>
</html>
